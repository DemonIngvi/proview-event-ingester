{{- if .Values.migrations.enabled }}
# Runs schema migrations before install/upgrade. The service binary takes a
# lock, so retries and parallel releases are safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-migrate
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: {{ .Values.migrations.hooks | default "pre-install,pre-upgrade" }}
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "app.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {{- include "app.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env: {{- include "app.env" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext: {{- include "app.containerSecurityContext" . | nindent 12 }}
{{- end }}
