name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/demoningvi/proview-event-ingester
  CHART: charts/proview-event-ingester

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v8
        with: { version: v2.15.0 }

  test:
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env: { CLICKHOUSE_PASSWORD: pw }
        ports: ["9000:9000"]
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --password pw -q 'SELECT 1'" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Integration tests
        env:
          PROVIEW_TEST_CLICKHOUSE: localhost:9000
          PROVIEW_TEST_CLICKHOUSE_PASSWORD: pw
        run: go test -race -count=1 -tags integration ./internal/chstore/...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint ${{ env.CHART }} --strict
      - name: Validate rendered manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template t ${{ env.CHART }} --set serviceMonitor.enabled=true --set keda.enabled=true \
            | ./kubeconform -strict -ignore-missing-schemas -summary

  image:
    needs: [lint, test, helm]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}

  chart:
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Package and push chart to GHCR (OCI)
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package ${{ env.CHART }} --version "$V" --app-version "$V"
          helm push proview-event-ingester-"$V".tgz oci://ghcr.io/demoningvi/charts
