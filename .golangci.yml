version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - prealloc
  settings:
    gosec:
      excludes:
        - G404 # math/rand is intentional for weighted selection / jitter
    revive:
      rules:
        - name: exported
          arguments: ["disableStutteringCheck"]
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx, prealloc]
formatters:
  enable: [gofmt, goimports]
